<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Browse by Genre | MoodFlix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    button:focus, a:focus { outline: 2px dashed #ef4444; outline-offset: 2px; }
  </style>
</head>
<body class="bg-gradient-to-br from-purple-800 via-indigo-900 to-red-900 text-white min-h-screen font-sans">
  <!-- Navigation -->
  <nav class="flex items-center justify-between px-6 py-4 bg-black/30 backdrop-blur sticky top-0 z-50">
    <div class="text-2xl font-bold text-red-500">MoodFlix</div>
    <div class="space-x-4">
      <a href="index.html" class="hover:underline">Home</a>
      <a href="recommendations.html" class="hover:underline">Recommendations</a>
      <a href="profile.html" class="hover:underline">Profile</a>
      <a href="manager.html" class="hover:underline">Manager Dashboard</a>
      <a href="genre.html" class="underline">Browse by Genre</a>
      <a href="login.html" class="bg-white text-black px-4 py-1 rounded hover:bg-gray-200">Login</a>
      <a href="register.html" class="bg-red-500 px-4 py-1 rounded hover:bg-red-600">Register</a>
    </div>
  </nav>

  <!-- Header -->
  <header class="text-center px-4 pt-10">
    <h1 class="text-4xl md:text-5xl font-extrabold text-red-500">Browse Movies by Genre</h1>
    <p class="mt-3 text-gray-200 max-w-2xl mx-auto">
      Prefer the classic way? Pick a genre below and we’ll show you what’s good.
    </p>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-10">
    <!-- Genre Grid -->
    <section id="genreSection" aria-labelledby="genreHeading">
      <h2 id="genreHeading" class="text-2xl font-semibold mb-4">Genres</h2>
      <div id="genreGrid" class="grid gap-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"></div>
    </section>

    <!-- Results Section -->
    <section id="resultsSection" class="hidden" aria-labelledby="resultsTitle">
      <div class="flex items-center justify-between mb-4">
        <h2 id="resultsTitle" class="text-2xl font-semibold">Results</h2>
        <div class="flex gap-2">
          <a href="index.html" class="px-3 py-2 bg-black/40 rounded hover:bg-black/60">Home</a>
          <button id="backBtn" type="button" class="px-3 py-2 bg-red-500 rounded hover:bg-red-600">Back to Genres</button>
        </div>
      </div>

      <!-- Loading -->
      <div id="loading" class="hidden flex items-center gap-3 text-gray-200 py-6" role="status" aria-live="polite">
        <svg class="animate-spin h-6 w-6" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
        </svg>
        <span>Loading movies…</span>
      </div>

      <!-- Error / Empty -->
      <div id="message" class="hidden bg-black/30 border border-white/10 rounded p-4 text-gray-200" role="alert"></div>

      <!-- Movies Grid -->
      <div id="moviesGrid" class="grid gap-6 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"></div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="text-center py-6 text-sm text-gray-300">
    © 2025 MoodFlix. All rights reserved.
  </footer>

  <script>
    "use strict";
    var API_BASE = "http://localhost:3000";

    var genreGrid = document.getElementById("genreGrid");
    var genreSection = document.getElementById("genreSection");
    var resultsSection = document.getElementById("resultsSection");
    var resultsTitle = document.getElementById("resultsTitle");
    var moviesGrid = document.getElementById("moviesGrid");
    var loadingEl = document.getElementById("loading");
    var messageEl = document.getElementById("message");
    var backBtn = document.getElementById("backBtn");

    /* always use official TMDB genres (no backend fetch) */
    var GENRES = [
      { id: 28, name: "Action" }, { id: 12, name: "Adventure" }, { id: 16, name: "Animation" },
      { id: 35, name: "Comedy" }, { id: 80, name: "Crime" }, { id: 99, name: "Documentary" },
      { id: 18, name: "Drama" }, { id: 10751, name: "Family" }, { id: 14, name: "Fantasy" },
      { id: 36, name: "History" }, { id: 27, name: "Horror" }, { id: 10402, name: "Music" },
      { id: 9648, name: "Mystery" }, { id: 10749, name: "Romance" }, { id: 878, name: "Sci-Fi" },
      { id: 10770, name: "TV Movie" }, { id: 53, name: "Thriller" }, { id: 10752, name: "War" },
      { id: 37, name: "Western" }
    ];

    function setLoading(show) { loadingEl.classList.toggle("hidden", !show); }

    function showMessage(msg) {
      if (!msg) { messageEl.classList.add("hidden"); messageEl.textContent = ""; return; }
      messageEl.textContent = msg; messageEl.classList.remove("hidden");
    }

    function renderGenres(genres) {
      genreGrid.innerHTML = "";
      for (var i = 0; i < genres.length; i++) {
        var g = genres[i];
        var card = document.createElement("button");
        card.type = "button";
        card.className = "p-4 rounded-xl bg-black/30 hover:bg-black/50 transition text-left border border-white/10";
        card.innerHTML =
          '<div class="text-xl font-semibold mb-1">' + g.name + '</div>' +
          '<div class="text-sm text-gray-300">Browse ' + g.name + ' movies →</div>';
        (function(id, name){
          card.addEventListener("click", function(){ fetchMoviesByGenreId(id, name); });
        })(g.id, g.name);
        genreGrid.appendChild(card);
      }
    }

    function buildMovieCard(m) {
      var title = (m && (m.title || m.name)) ? (m.title || m.name) : "Untitled";
      var rating = (m && (m.rating != null ? m.rating : m.vote_average)) != null ? (m.rating != null ? m.rating : m.vote_average) : "N/A";
      var poster = (m && (m.poster || m.poster_url || m.posterPath)) ? (m.poster || m.poster_url || m.posterPath) : "";
      var imgHtml = poster
        ? '<img src="' + poster + '" alt="' + title.replace(/"/g, "&quot;") + '" class="w-full h-64 object-cover rounded-t-xl">'
        : '<div class="w-full h-64 bg-black/40 rounded-t-xl flex items-center justify-center text-gray-400">No Image</div>';
      return (
        '<article class="bg-black/30 border border-white/10 rounded-xl overflow-hidden hover:bg-black/50 transition">' +
          imgHtml +
          '<div class="p-4">' +
            '<h3 class="font-semibold">' + title + '</h3>' +
            '<p class="text-sm text-gray-300">Rating: ' + rating + '</p>' +
          '</div>' +
        '</article>'
      );
    }

    function fetchMoviesByGenreId(genreId, displayName) {
      genreSection.classList.add("hidden");
      resultsSection.classList.remove("hidden");
      moviesGrid.innerHTML = "";
      showMessage("");
      setLoading(true);
      resultsTitle.textContent = displayName + " Movies";

      var url = API_BASE + "/api/movies?genreId=" + encodeURIComponent(genreId);

      fetch(url, { method: "GET" })
        .then(function(res){
          if (!res.ok) return res.text().then(function(t){ throw new Error("HTTP " + res.status + ": " + t); });
          return res.json();
        })
        .then(function(movies){
          if (!Array.isArray(movies) || movies.length === 0) {
            showMessage("No movies found for this genre. Try another one.");
            return;
          }
          var html = "";
          for (var i = 0; i < movies.length; i++) html += buildMovieCard(movies[i]);
          moviesGrid.innerHTML = html;
        })
        .catch(function(err){
          console.error(err);
          showMessage("There was a problem fetching movies: " + err.message);
        })
        .finally(function(){ setLoading(false); });
    }

    if (backBtn) {
      backBtn.addEventListener("click", function () {
        resultsSection.classList.add("hidden");
        genreSection.classList.remove("hidden");
        showMessage("");
        moviesGrid.innerHTML = "";
        try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (e) {}
      });
    }

    // Boot: render the canonical TMDB list (no duplicates)
    renderGenres(GENRES);
  </script>
</body>
</html>
